# =============================================================================
# pipeline-ci-cd.yml
# Focused validation for the FenBrowser pipeline subsystem
# (FenBrowser.Core/Engine/Pipeline*.cs and its test surface).
#
# Scope:
#   - Build the test surface once per job (no cross-job --no-build coupling).
#   - Run only the pipeline-subsystem tests that actually exist in the repo.
#   - Static check for forbidden patterns on the pipeline source files.
#
# General CI (P0 gates, nightly regression, win-x64 publish) lives in
# build-fenbrowser-exe.yml; this workflow deliberately stays narrow.
# =============================================================================

name: Pipeline Subsystem CI

on:
  push:
    branches: [main, master, develop, rewrite-history]
    paths:
      - "FenBrowser.Core/Engine/Pipeline*.cs"
      - "FenBrowser.FenEngine/Rendering/**/*.cs"
      - "FenBrowser.Tests/Engine/Pipeline*.cs"
      - ".github/workflows/pipeline-ci-cd.yml"
  pull_request:
    branches: [main, master, develop, rewrite-history]
    paths:
      - "FenBrowser.Core/Engine/Pipeline*.cs"
      - "FenBrowser.FenEngine/Rendering/**/*.cs"
      - "FenBrowser.Tests/Engine/Pipeline*.cs"
      - ".github/workflows/pipeline-ci-cd.yml"
  workflow_dispatch:
    inputs:
      enable_detailed_logging:
        description: "Enable detailed pipeline telemetry in tests"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pipeline-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  PIPELINE_TELEMETRY_ENABLED: ${{ inputs.enable_detailed_logging || 'false' }}
  PIPELINE_STRICT_MODE: "false"

jobs:
  build:
    name: Build solution (sanity)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET SDK from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true

      - name: Restore solution
        run: dotnet restore FenBrowser.sln

      - name: Build solution (Release)
        run: dotnet build FenBrowser.sln -c Release --no-restore

  pipeline-tests:
    name: Pipeline tests - ${{ matrix.test_class }}
    needs: build
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Only test classes that actually exist under FenBrowser.Tests/Engine/.
        # If new pipeline test classes are added, append them here.
        test_class:
          - PipelineContextTests
          - PipelineExceptionBoundaryTests
          - PipelineInvariantGateTests
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET SDK from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true

      - name: Build test surface
        run: dotnet build FenBrowser.Tests/FenBrowser.Tests.csproj -c Release

      - name: Run ${{ matrix.test_class }}
        env:
          PIPELINE_TELEMETRY_ENABLED: ${{ env.PIPELINE_TELEMETRY_ENABLED }}
          PIPELINE_STRICT_MODE: ${{ env.PIPELINE_STRICT_MODE }}
        run: >-
          dotnet test FenBrowser.Tests/FenBrowser.Tests.csproj
          -c Release
          --no-build
          --filter "FullyQualifiedName~${{ matrix.test_class }}"
          --logger "trx;LogFileName=${{ matrix.test_class }}.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-tests-${{ matrix.test_class }}
          path: TestResults/
          if-no-files-found: ignore
          retention-days: 14

  pipeline-source-audit:
    name: Pipeline source audit (advisory)
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Required pipeline files present
        shell: pwsh
        run: |
          $required = @(
            'FenBrowser.Core/Engine/PipelineContext.cs',
            'FenBrowser.Core/Engine/PipelineExceptionBoundary.cs',
            'FenBrowser.Core/Engine/PipelineResourceGuard.cs',
            'FenBrowser.Core/Engine/PipelineTelemetry.cs',
            'FenBrowser.Core/Engine/PipelineIntegrationLayer.cs',
            'FenBrowser.Tests/Engine/PipelineExceptionBoundaryTests.cs'
          )
          $missing = @()
          foreach ($f in $required) {
            if (-not (Test-Path $f)) { $missing += $f }
          }
          if ($missing.Count -gt 0) {
            Write-Error ("Missing required pipeline files:`n  - " + ($missing -join "`n  - "))
            exit 1
          }
          Write-Host "All required pipeline files present."

      - name: Scan pipeline sources for forbidden patterns (advisory)
        shell: pwsh
        run: |
          # Advisory-only: surface common smell-patterns on pipeline hot paths.
          # Does NOT fail the build; CLAUDE.md DoD Tier 0 covers hard rules.
          $patterns = @(
            'Console\.WriteLine',
            'Debug\.WriteLine',
            'throw new Exception\(',
            'catch\s*\(Exception\s+\w+\)\s*\{'
          )
          $hits = Get-ChildItem -Path FenBrowser.Core/Engine -Filter 'Pipeline*.cs' -File |
            Select-String -Pattern $patterns
          if ($hits) {
            Write-Host "::warning::Pipeline source pattern hits (advisory only):"
            foreach ($h in $hits) {
              Write-Host ("  {0}:{1}  {2}" -f $h.Path, $h.LineNumber, $h.Line.Trim())
            }
          } else {
            Write-Host "No forbidden patterns found on pipeline sources."
          }

  summary:
    name: Pipeline CI summary
    needs: [pipeline-tests, pipeline-source-audit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate result
        shell: bash
        run: |
          set -e
          tests_result="${{ needs.pipeline-tests.result }}"
          audit_result="${{ needs.pipeline-source-audit.result }}"
          {
            echo "## Pipeline Subsystem CI"
            echo ""
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| pipeline-tests | ${tests_result} |"
            echo "| pipeline-source-audit | ${audit_result} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$tests_result" != "success" ] || [ "$audit_result" != "success" ]; then
            echo "One or more required jobs did not succeed."
            exit 1
          fi
