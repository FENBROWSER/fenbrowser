name: FenBrowser CI

on:
  pull_request:
    branches:
      - main
      - rewrite-history
    paths-ignore:
      - "docs/**"
      - "Results/**"
      - "logs/**"
      - "**/*.md"
  push:
    branches:
      - main
      - new
    paths-ignore:
      - "docs/**"
      - "Results/**"
      - "logs/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      run_full_regression:
        description: "Run full FenBrowser.Tests regression suite"
        required: false
        default: false
        type: boolean
      publish_windows_artifact:
        description: "Publish self-contained FenBrowser.Host win-x64 artifact"
        required: false
        default: false
        type: boolean
      run_rendering_loop:
        description: "Run the focused rendering contract loop"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  quality-gate:
    name: Quality Gate (blocking)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET SDK from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Validate spec governance headers
        shell: pwsh
        run: ./scripts/validate_spec_headers.ps1

      - name: Check placeholder assertions
        shell: pwsh
        run: |
          $matches = Get-ChildItem FenBrowser.Tests -Recurse -File -Include *.cs |
            Select-String -Pattern 'Assert\.True\(true\)|Assert\.False\(false\)' -CaseSensitive
          if ($matches) {
            $lines = $matches | ForEach-Object { "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
            Write-Error ("Placeholder assertions found:`n" + ($lines -join "`n"))
            exit 1
          }

      - name: Run cleanup audit guard
        shell: pwsh
        run: ./scripts/ci/run-code-cleanup-audit.ps1 -OutputPath "Results\code_cleanup_audit_quality_gate.md" -FailOnMedium

      - name: Build WebIdlGen prerequisite
        run: dotnet build FenBrowser.WebIdlGen/FenBrowser.WebIdlGen.csproj -c Release --nologo

      - name: Build test surface
        run: dotnet build FenBrowser.Tests/FenBrowser.Tests.csproj -c Release --nologo

      - name: Run P0 hardening gates
        # Every filter is validated against compiled tests; a filter
        # that matches zero tests fails this job instead of exiting green.
        shell: pwsh
        run: ./scripts/ci/Invoke-TestFilters.ps1 -Project "FenBrowser.Tests/FenBrowser.Tests.csproj" -NoBuild -Filters @(
            "FullyQualifiedName~FenBrowser.Tests.Core.Network.CspPolicyTests",
            "FullyQualifiedName~FenBrowser.Tests.Core.CorsHandlerTests",
            "FullyQualifiedName~FenBrowser.Tests.Core.BrowserCookieJarTests",
            "FullyQualifiedName~FenBrowser.Tests.Core.DocumentSecurityContextTests",
            "FullyQualifiedName~FenBrowser.Tests.Core.SandboxLaunchPolicyTests"
          )

  full-regression:
    name: Full Regression (nightly or manual)
    needs: quality-gate
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_full_regression) }}
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET SDK from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Build test surface
        run: dotnet build FenBrowser.Tests/FenBrowser.Tests.csproj -c Release --nologo

      - name: Run full unit test suite
        run: dotnet test FenBrowser.Tests/FenBrowser.Tests.csproj -c Release --no-build --logger trx --results-directory TestResults --verbosity normal

      - name: Run verification guard audit (advisory)
        continue-on-error: true
        shell: pwsh
        run: ./scripts/ci/verify-verification-guards.ps1

      - name: Upload full regression test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-regression-test-results
          path: TestResults/
          if-no-files-found: ignore

  rendering-loop:
    name: Daily Rendering Loop (blocking)
    needs: quality-gate
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_rendering_loop) }}
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET SDK from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Build rendering test surface
        run: dotnet build FenBrowser.Tests/FenBrowser.Tests.csproj -c Release --nologo

      - name: Run focused rendering contracts
        shell: pwsh
        run: ./scripts/ci/run-daily-rendering-loop.ps1 -NoBuild

      - name: Upload rendering loop results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-rendering-loop-results
          path: TestResults/
          if-no-files-found: error

  js-conformance:
    name: FenJS full suite (advisory)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET SDK from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Build FenBrowser.Js.Tests
        run: dotnet build FenBrowser.Js.Tests/FenBrowser.Js.Tests.csproj -c Release --nologo

      - name: Run full FenBrowser.Js.Tests suite
        # The published baseline currently has known failures, so surface the full
        # result without blocking unrelated PRs. Promote this step to blocking only
        # after the recorded failure set reaches zero.
        continue-on-error: true
        run: dotnet test FenBrowser.Js.Tests/FenBrowser.Js.Tests.csproj -c Release --no-build --logger "trx;LogFileName=js-tests.trx" --results-directory TestResults/js --verbosity minimal

      - name: Validate js suite actually ran
        shell: pwsh
        run: |
          $trx = Get-ChildItem TestResults/js -Filter '*.trx' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $trx) { Write-Error "No TRX produced by FenBrowser.Js.Tests run."; exit 1 }
          [xml]$doc = Get-Content -LiteralPath $trx.FullName -Raw
          $total = [int]$doc.TestRun.ResultSummary.Counters.total
          $passed = [int]$doc.TestRun.ResultSummary.Counters.passed
          $failed = [int]$doc.TestRun.ResultSummary.Counters.failed
          if ($total -lt 2800) {
            Write-Error ("FenBrowser.Js.Tests ran only {0} tests; expected at least 2,800." -f $total)
            exit 1
          }
          Write-Host ("FenBrowser.Js.Tests executed {0}: passed={1}, failed={2}." -f $total, $passed, $failed)
          if ($failed -gt 0) {
            Write-Host ("::warning::FenBrowser.Js.Tests remains advisory with {0} known failures." -f $failed)
          }

      - name: Upload js test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: js-conformance-test-results
          path: TestResults/js/
          if-no-files-found: ignore

  fuzz-suite:
    name: Fuzz suite (blocking on PR)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET SDK from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Build fuzz surface
        run: dotnet build FenBrowser.Js.Fuzz/FenBrowser.Js.Fuzz.csproj -c Release --nologo

      - name: Run JS engine fuzz suite
        run: dotnet test FenBrowser.Js.Fuzz/FenBrowser.Js.Fuzz.csproj -c Release --no-build --logger trx --results-directory TestResults --verbosity minimal

      - name: Upload fuzz test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-test-results
          path: TestResults/
          if-no-files-found: ignore

  media-suite:
    name: Media engine tests (blocking)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET SDK from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Build media engine and tests
        run: dotnet build FenBrowser.Media.Tests/FenBrowser.Media.Tests.csproj -c Release --nologo

      - name: Run media engine tests
        run: dotnet test FenBrowser.Media.Tests/FenBrowser.Media.Tests.csproj -c Release --no-build --logger trx --results-directory TestResults/media --verbosity minimal

      - name: Upload media test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-test-results
          path: TestResults/media/
          if-no-files-found: ignore

  package-windows:
    name: Publish Windows Artifact (tag or manual)
    needs: quality-gate
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_windows_artifact) }}
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET SDK from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Build WebIdlGen prerequisite
        run: dotnet build FenBrowser.WebIdlGen/FenBrowser.WebIdlGen.csproj -c Release --nologo

      - name: Restore FenBrowser.Host (win-x64)
        run: dotnet restore FenBrowser.Host/FenBrowser.Host.csproj -r win-x64 --nologo

      - name: Publish FenBrowser.Host (Release win-x64)
        run: >
          dotnet publish FenBrowser.Host/FenBrowser.Host.csproj
          --no-restore
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:IncludeAllContentForSelfExtract=true
          -o artifacts/fenbrowser-win-x64

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: fenbrowser-win-x64
          path: artifacts/fenbrowser-win-x64
          if-no-files-found: error
